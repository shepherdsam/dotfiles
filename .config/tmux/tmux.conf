# Tmux configuration
# Change prefix key to Ctrl+a (common setup)

# Unbind default prefix (C-b)
unbind C-b

# Set new prefix to C-a
set -g prefix C-a

# Bind C-a to send C-a to inner programs (e.g., nested tmux/screen)
bind C-a send-prefix

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf!"

# Enable mouse (optional, modern default)
# Ghostty note: with tmux mouse on + Ghostty shell integration,
# open hyperlinks with Shift+Cmd+Click (Ghostty steals the event from tmux)
set -g mouse on

# More scrollback
set -g history-limit 10000

# Pi Recommendations
set -g extended-keys on
set -g extended-keys-format csi-u

# Grok
# terminal-features advertises hyperlink support to inner applications
# (tmux passes OSC 8 through; click them with Shift+Cmd+Click in Ghostty)
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:hyperlinks"
# set -g set-clipboard on

# New windows and panes inherit the current working directory
# bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create new session with prompt (very handy)
bind C command-prompt -p "New session name:" "new-session -s '%%'"

# Session snapshots (bin/tmux-save, bin/tmux-restore, bin/tmux-up)
# prefix + S → manual save to "last"
bind S run-shell "$HOME/bin/tmux-save >/dev/null 2>&1; tmux display-message 'Sessions saved'"
# Quiet auto-save of "last" every 15 minutes (throttled inside tmux-save --auto).
# status-interval stays short so the clock updates; --auto no-ops when fresh.
set -g status-interval 15
set -g status-right "#($HOME/bin/tmux-save --auto >/dev/null 2>&1)#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" %a %b %d %I:%M%p"

# Theme (managed by bin/theme - defaults to dark; switcher will rewrite this line)
source-file ~/.config/tmux/one_dark.conf

